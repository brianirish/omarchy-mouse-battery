name: Bug report
description: The widget is missing, wrong, or misbehaving
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security problems should go through
        [private vulnerability reporting](../../security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `omarchy version`, and your plugin commit (`git -C ~/.config/omarchy/plugins/brianirish.mouse-battery log -1 --oneline`).
      render: text
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device as UPower sees it
      description: "Output of `upower -i $(upower -e | grep -v -e DisplayDevice -e line_power -e BAT | head -1)` — the model, type, percentage, battery-level and state lines are the useful ones."
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "QML/shell output helps: `journalctl --user --since '10 minutes ago' | grep -i -e qml -e mouse-battery`"
      render: text
